<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E-Guinzburg · lugar libre</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap">
  <style>
    /* Estética E-GUINZBURG · radar nocturno */
    :root {
      --bg:#05070d; --fg:#f2f5ff; --muted:#8a93a6;
      --accent:#1f3cff; --cyan:#3fd3ff; --panel:#0a0f1ae6;
      /* Espacio para el badge de Netlify. Poner 0 cuando haya dominio propio. */
      --gap-bottom:72px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
      font-family:"Montserrat", system-ui, sans-serif; overflow:hidden; }
    #map { position:fixed; inset:0; background:var(--bg); }
    .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.6) contrast(1.15) sepia(.6) hue-rotate(170deg) saturate(2); }
    .leaflet-control-attribution { background:#05070dcc !important; color:var(--muted) !important; font-size:10px; }
    .leaflet-control-attribution a { color:var(--cyan) !important; }

    /* Encabezado con el muñeco */
    #header { position:fixed; top:12px; left:12px; right:120px; z-index:1000; display:flex; align-items:center; gap:10px;
      background:var(--panel); border:1px solid #3fd3ff55; border-radius:16px; padding:8px 10px;
      backdrop-filter:blur(8px); box-shadow:0 6px 24px #1f3cff33; }
    #avatar { width:44px; height:44px; border-radius:50%; object-fit:cover; background:var(--bg);
      border:2px solid var(--cyan); box-shadow:0 0 12px #3fd3ff88; flex:0 0 auto; }
    #brand { font-size:11px; font-weight:800; letter-spacing:.22em; color:var(--cyan); text-transform:uppercase; }
    #subtitle { font-size:14px; margin-top:2px; font-variant-numeric:tabular-nums; }

    /* Recentrar */
    #recenter { position:fixed; top:12px; right:12px; z-index:1000; width:auto; padding:12px 14px; border-radius:999px;
      background:var(--panel); color:var(--cyan); border:1px solid #3fd3ff55; font-size:11px; letter-spacing:.16em;
      text-transform:uppercase; box-shadow:none; }

    /* Panel inferior */
    #panel { position:fixed; left:0; right:0; bottom:var(--gap-bottom); z-index:1000; padding:16px;
      background:var(--panel); backdrop-filter:blur(8px); border-top:1px solid #3fd3ff55;
      border-radius:18px 18px 0 0; box-shadow:0 -8px 30px #1f3cff33; }
    #status { margin:0 0 12px; font-size:13px; color:var(--muted); text-align:center; letter-spacing:.02em; min-height:1.2em; }
    .actions { display:grid; gap:8px; }
    button { font:inherit; font-weight:600; letter-spacing:.04em; width:100%; padding:13px 16px; border:0; border-radius:12px;
      background:var(--accent); color:#fff; cursor:pointer; box-shadow:0 0 0 1px #3fd3ff40, 0 6px 20px #1f3cff55; }
    button.secondary { background:transparent; color:var(--fg); border:1px solid #3fd3ff55; box-shadow:none; }
    button:disabled { opacity:.5; cursor:default; }
    input#code { font:inherit; padding:12px; border-radius:12px; border:1px solid #3fd3ff55; background:transparent;
      color:var(--fg); text-transform:uppercase; }

    /* Overlay de avisos */
    #overlay { position:fixed; inset:0; z-index:2000; background:#000a; display:none; align-items:center; justify-content:center; padding:16px; }
    #overlay.show { display:flex; }
    #overlay .card { background:var(--panel); border:1px solid #3fd3ff55; color:var(--fg); padding:20px; border-radius:16px;
      max-width:340px; width:100%; display:grid; gap:14px; }

    /* Marcadores */
    .ring-pulse { animation: ringPulse 2.4s ease-out infinite; }
    @keyframes ringPulse {
      0% { stroke-opacity:.9; stroke-width:2; }
      100% { stroke-opacity:0; stroke-width:6; }
    }
    .meet { position:absolute; transform:translate(-50%, -100%); width:90px; text-align:center; }
    .meet img { width:64px; height:auto; display:block; margin:0 auto; transform-origin:center;
      animation: spinY 3s linear infinite; filter: drop-shadow(0 0 8px #3fd3ff88); }
    @keyframes spinY {
      from { transform: perspective(400px) rotateY(0deg); }
      to   { transform: perspective(400px) rotateY(360deg); }
    }
    .lbl { display:inline-block; margin-top:4px; background:#05070dcc; color:var(--cyan); font-size:11px; font-weight:800;
      letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:999px; white-space:nowrap;
      border:1px solid var(--cyan); box-shadow:0 0 12px #3fd3ff66; }
    .lbl .cd { font-variant-numeric:tabular-nums; }
    .leaflet-popup-content-wrapper { background:var(--panel); color:var(--fg); border:1px solid #3fd3ff55; border-radius:12px; }
    .leaflet-popup-tip { background:var(--panel); }
    .leaflet-popup-content button { width:auto; padding:8px 12px; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="header">
    <img id="avatar" src="assets/muneco.png" alt="">
    <div>
      <div id="brand">E-Guinzburg</div>
      <div id="subtitle">Conectando…</div>
    </div>
  </div>

  <button id="recenter" disabled>Recentrar</button>

  <div id="panel">
    <p id="status">Avisá que liberás un lugar, o tocá un pin para ir a buscarlo.</p>
    <div class="actions">
      <button id="btnShare" hidden>Compartir mi ubicación</button>
      <button id="btnLeave" hidden>Me estoy yendo</button>
      <button id="btnCancel" class="secondary" hidden>Cancelar mi espacio</button>
      <div id="gate" hidden class="actions">
        <input id="code" type="text" autocomplete="off" autocapitalize="characters" placeholder="Código de acceso">
        <button id="btnJoin">Entrar</button>
      </div>
    </div>
  </div>

  <div id="overlay">
    <div class="card">
      <p id="overlayText" style="margin:0"></p>
      <button id="overlayOk">Entendido</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
    // ---- Configuración ----
    const SUPABASE_URL = 'https://thbiaafcyuzupxbhpqab.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_sFmYrnVlogUeuOTpfGI4jQ_Xs_NC29S';
    const POSITION_SEND_MS = 10 * 1000;   // cada cuánto mandamos la posición
    const ROUTE_URL = 'https://router.project-osrm.org/route/v1/driving';

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ---- Estado ----
    let me = null;             // usuario anónimo
    let myPos = null;          // {lat, lng} exacto (solo local)
    let watchId = null;
    let lastSent = 0;
    let serverOffset = 0;      // hora servidor - hora local
    let spots = [];            // espacios visibles (RLS filtra)
    const markers = new Map(); // spot.id -> {marker, circle, spot}
    let routeLayer = null;
    let routeInfo = '';
    let myMarker = null;
    let centered = false;

    // ---- Helpers ----
    const $ = (id) => document.getElementById(id);
    const now = () => Date.now() + serverOffset;
    const fmt = (ms) => {
      const s = Math.max(0, Math.ceil(ms / 1000));
      return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    };
    function showOverlay(text) { $('overlayText').textContent = text; $('overlay').classList.add('show'); }
    $('overlayOk').onclick = () => $('overlay').classList.remove('show');

    // ---- Mapa ----
    const map = L.map('map', { zoomControl: false }).setView([-34.6037, -58.3816], 15);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    $('recenter').onclick = () => {
      if (!myPos) return showOverlay('Compartí tu ubicación para recentrar el mapa.');
      map.setView([myPos.lat, myPos.lng], 17);
    };

    // ---- Sesión ----
    async function init() {
      const { data: sess } = await sb.auth.getSession();
      if (!sess.session) {
        const { error } = await sb.auth.signInAnonymously();
        if (error) { $('status').textContent = 'No se pudo entrar: ' + error.message; return; }
      }
      me = (await sb.auth.getUser()).data.user;
      const { data: allowed } = await sb.rpc('is_allowed');
      if (allowed) return start();
      showGate();
    }

    // ---- Código de acceso ----
    function showGate() {
      $('subtitle').textContent = 'Acceso restringido';
      $('status').textContent = 'Ingresá el código de acceso para entrar.';
      $('gate').hidden = false;
      $('btnShare').hidden = true;
      $('code').focus();
    }

    $('btnJoin').onclick = async () => {
      const code = $('code').value.trim();
      if (!code) return;
      const { data, error } = await sb.rpc('join_with_code', { p_code: code });
      if (error) return showOverlay('No se pudo validar el código: ' + error.message);
      if (!data) return showOverlay('Código incorrecto.');
      $('gate').hidden = true;
      start();
    };
    $('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btnJoin').click(); });

    async function start() {
      $('btnShare').hidden = false;
      $('subtitle').textContent = 'Sin ubicación';
      $('status').textContent = 'Compartí tu ubicación para empezar.';
      await syncServerClock();
      await refresh();
      subscribe();
      setInterval(refresh, 10000);   // respaldo por si se pierde un evento en tiempo real
      setInterval(tick, 1000);
    }

    async function syncServerClock() {
      const t0 = Date.now();
      const { data } = await sb.rpc('server_now');
      const t1 = Date.now();
      if (data) serverOffset = Date.parse(data) - (t0 + t1) / 2;
    }

    // ---- Ubicación (solo con permiso) ----
    $('btnShare').onclick = () => {
      if (!navigator.geolocation) return showOverlay('Tu navegador no permite compartir ubicación.');
      watchId = navigator.geolocation.watchPosition(onPos, onGeoErr,
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 });
      $('btnShare').hidden = true;
      $('subtitle').textContent = 'Buscando tu ubicación…';
    };

    function onGeoErr(e) {
      showOverlay('No pudimos obtener tu ubicación: ' + e.message + '. Revisá el permiso del navegador.');
    }

    async function onPos(p) {
      myPos = { lat: p.coords.latitude, lng: p.coords.longitude };
      if (!myMarker) {
        myMarker = L.circleMarker([myPos.lat, myPos.lng], {
          radius: 8, color: '#3fd3ff', fillColor: '#1f3cff', fillOpacity: 1, weight: 2
        }).addTo(map);
      } else {
        myMarker.setLatLng([myPos.lat, myPos.lng]);
      }
      if (!centered) { map.setView([myPos.lat, myPos.lng], 17); centered = true; }

      if (Date.now() - lastSent > POSITION_SEND_MS) {
        lastSent = Date.now();
        await sb.rpc('update_position', { p_lat: myPos.lat, p_lng: myPos.lng });
        await refresh();   // si me moví más de 30 m, mi espacio pudo cancelarse
      }
      updatePanel();
    }

    // ---- Me estoy yendo / cancelar ----
    $('btnLeave').onclick = async () => {
      if (!myPos) return showOverlay('Todavía no tenemos tu ubicación.');
      $('btnLeave').disabled = true;
      const { error } = await sb.rpc('release_spot', { p_lat: myPos.lat, p_lng: myPos.lng });
      $('btnLeave').disabled = false;
      if (error) return showOverlay('No se pudo liberar el espacio: ' + error.message);
      lastSent = Date.now();
      await refresh();
    };

    $('btnCancel').onclick = async () => {
      await sb.rpc('cancel_my_spot');
      await refresh();
    };

    // ---- Ruta ----
    async function drawRoute(to) {
      if (!myPos) return showOverlay('Compartí tu ubicación para ver la ruta.');
      const url = `${ROUTE_URL}/${myPos.lng},${myPos.lat};${to.lng},${to.lat}?overview=full&geometries=geojson`;
      try {
        const res = await fetch(url);
        const json = await res.json();
        if (!json.routes || !json.routes[0]) return showOverlay('No encontramos una ruta hasta ese punto.');
        const route = json.routes[0];
        if (routeLayer) routeLayer.remove();
        routeLayer = L.geoJSON(route.geometry, {
          style: { color: '#3fd3ff', weight: 5, opacity: 0.85, dashArray: '6 8' }
        }).addTo(map);
        map.fitBounds(routeLayer.getBounds(), { padding: [40, 160] });
        const km = route.distance / 1000;
        const dist = km >= 1 ? `${km.toFixed(1)} km` : `${Math.round(route.distance)} m`;
        const mins = Math.max(1, Math.round(route.duration / 60));
        routeInfo = `A ${dist} · ${mins} min en auto`;
        updatePanel();
      } catch (e) {
        showOverlay('No pudimos calcular la ruta. Probá de nuevo.');
      }
    }

    function clearRoute() {
      if (routeLayer) { routeLayer.remove(); routeLayer = null; }
      routeInfo = '';
    }

    // ---- Aceptar ----
    async function accept(id) {
      const { data, error } = await sb.rpc('accept_spot', { p_spot: id });
      if (error) {
        const msg = error.message.includes('spot_unavailable')
          ? 'Ese espacio ya no está disponible.'
          : 'No se pudo aceptar: ' + error.message;
        return showOverlay(msg);
      }
      clearRoute();
      const exact = data && data[0];
      if (exact) {
        const to = { lat: exact.out_lat, lng: exact.out_lng };
        L.marker([to.lat, to.lng]).addTo(map).bindPopup('Espacio aceptado').openPopup();
        showOverlay('Aceptaste el espacio. Seguí la ruta.');
        await drawRoute(to);
      }
      await refresh();
    }

    // ---- Datos ----
    function mine() {
      return spots.find(s => s.owner_id === me?.id && s.status === 'released' && Date.parse(s.expires_at) > now());
    }

    async function refresh() {
      if (!me) return;
      const { data, error } = await sb.from('spots').select('*').order('released_at', { ascending: false });
      if (error) return;
      spots = data.filter(s => s.status === 'released' && Date.parse(s.expires_at) > now());
      render();
      updatePanel();
    }

    function render() {
      const keep = new Set();
      for (const s of spots) {
        if (s.owner_id === me.id) continue;
        keep.add(s.id);
        if (markers.has(s.id)) { markers.get(s.id).spot = s; continue; }

        const circle = L.circle([s.approx_lat, s.approx_lng], {
          radius: 100, color: '#3fd3ff', weight: 2, fillColor: '#1f3cff', fillOpacity: 0.18,
          className: 'ring-pulse'
        }).addTo(map);
        const marker = L.marker([s.approx_lat, s.approx_lng], {
          icon: L.divIcon({
            className: '', iconSize: null,
            html: '<div class="meet"><img src="assets/muneco.png" alt="E-Guinzburg"><div class="lbl">Libre · <span class="cd"></span></div></div>'
          })
        }).addTo(map);

        // Tocar el pin traza la ruta; el botón de la burbuja acepta el espacio
        const el = document.createElement('div');
        const btn = document.createElement('button');
        btn.textContent = 'Aceptar espacio';
        btn.onclick = () => { marker.closePopup(); accept(s.id); };
        el.appendChild(btn);
        marker.bindPopup(el);
        marker.on('click', () => drawRoute({ lat: s.approx_lat, lng: s.approx_lng }));

        markers.set(s.id, { marker, circle, spot: s });
      }
      for (const [id, m] of markers) {
        if (!keep.has(id)) { m.marker.remove(); m.circle.remove(); markers.delete(id); }
      }
      tick();
    }

    function tick() {
      // cuenta regresiva en cada espacio
      for (const [, m] of markers) {
        const left = Date.parse(m.spot.expires_at) - now();
        const cd = m.marker.getElement()?.querySelector('.cd');
        if (cd) cd.textContent = fmt(left);
        if (left <= 0) { refresh(); return; }
      }
      const mySpot = mine();
      if (mySpot) {
        const left = Date.parse(mySpot.expires_at) - now();
        if (left <= 0) { refresh(); return; }
        $('subtitle').textContent = `Esperando · ${fmt(left)}`;
      }
    }

    function updatePanel() {
      const ms = mine();
      const ready = !!myPos && watchId !== null;
      $('btnShare').hidden = watchId !== null;
      $('btnLeave').hidden = !ready || !!ms;
      $('btnCancel').hidden = !ms;
      $('recenter').disabled = !myPos;

      const libres = spots.filter(s => s.owner_id !== me?.id).length;

      if (ms) {
        $('status').textContent = 'Si te movés más de 30 m, tu espacio se cancela.';
      } else if (routeInfo) {
        $('status').textContent = routeInfo;
      } else if (libres) {
        $('status').textContent = 'Tocá un pin para ver la ruta y aceptarlo.';
      } else {
        $('status').textContent = 'Avisá que liberás un lugar, o tocá un pin para ir a buscarlo.';
      }

      if (!ms) {
        $('subtitle').textContent = !ready
          ? 'Sin ubicación'
          : (libres ? `${libres} libre${libres > 1 ? 's' : ''} cerca` : 'Sin espacios libres');
      }
    }

    // ---- Tiempo real ----
    function subscribe() {
      sb.channel('spots-live')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'spots' }, () => refresh())
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'spots', filter: `owner_id=eq.${me.id}` }, (payload) => {
          if (payload.new.status === 'accepted') {
            showOverlay('Alguien aceptó tu espacio. ¡Ya es suyo!');
          }
          refresh();
        })
        .subscribe();
    }

    init();
  </script>
</body>
</html>
